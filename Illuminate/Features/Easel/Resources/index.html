<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Illuminate Easel</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="toolbar">
    <div class="tool-group" role="toolbar" aria-label="Drawing tools">
      <button data-tool="select" class="tool active" title="Select — Cursor (V)" aria-label="Select">↖</button>
      <button data-tool="pen" class="tool" title="Pen (P)" aria-label="Pen">✏</button>
      <button data-tool="rect" class="tool" title="Box — Rectangle (R)">▢</button>
      <button data-tool="arrow" class="tool" title="Arrow (A)">→</button>
      <button data-tool="text" class="tool" title="Text (T)">T</button>
    </div>
    <div class="separator"></div>
    <div class="tool-group">
      <label class="color-label" title="Stroke color">
        <input type="color" id="strokeColor" value="#1a1a1a" aria-label="Stroke color">
      </label>
      <label class="width-label" title="Stroke width">
        <input type="range" id="strokeWidth" min="1" max="24" value="3" aria-label="Stroke width">
        <span id="widthValue">3</span>
      </label>
    </div>
    <div class="spacer"></div>
    <div class="tool-group">
      <span id="status" aria-live="polite"></span>
    </div>
  </div>

  <div id="canvas-wrap">
    <canvas id="c" width="1600" height="1000" aria-label="Whiteboard canvas"></canvas>
  </div>

  <script src="fabric.min.js"></script>
  <script type="module" src="bridge.js"></script>
  <script type="module" src="canvas.js"></script>
  <script type="module" src="history.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
