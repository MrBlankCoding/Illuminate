name: Xcode - Build, Analyze, and Test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    name: Build, analyze, and run regular tests
    runs-on: macos-15
    timeout-minutes: 30
    env:
      SCHEME: Illuminate
      PROJECT: Illuminate.xcodeproj
      DESTINATION: platform=macOS,arch=arm64
      DERIVED_DATA: build/DerivedData
      BUILD_RESULT: build/Illuminate-build.xcresult
      TEST_RESULT: build/Illuminate-tests.xcresult

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version

      - name: Build and Analyze
        run: |
          set -o pipefail
          xcodebuild clean build analyze \
            -scheme "$SCHEME" \
            -project "$PROJECT" \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$BUILD_RESULT" | xcbeautify

      - name: Test with Code Coverage
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme "$SCHEME" \
            -project "$PROJECT" \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            -enableCodeCoverage YES \
            -resultBundlePath "$TEST_RESULT" | xcbeautify

      - name: Export Code Coverage Report
        if: always()
        run: |
          if [ -d "$TEST_RESULT" ]; then
            xcrun xccov view --report --json "$TEST_RESULT" > build/coverage.json
          fi

      - name: Upload Xcode Results and Coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: illuminate-xcode-results
          path: |
            build/*.xcresult
            build/coverage.json
          if-no-files-found: error
          retention-days: 14
