name: Xcode - Build, Analyze, and Test

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    name: Build, analyze, and run regular tests
    runs-on: macos-26
    timeout-minutes: 30

    env:
      SCHEME: Illuminate-Coverage
      UNIT_TEST_TARGET: IlluminateTests
      UI_TEST_TARGET: IlluminateUITests
      PROJECT: Illuminate.xcodeproj
      DESTINATION: platform=macOS,arch=arm64
      DERIVED_DATA: build/DerivedData
      BUILD_RESULT: build/Illuminate-build.xcresult
      TEST_RESULT: build/Illuminate-tests.xcresult

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
          swift --version

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -scheme "$SCHEME" \
            -project "$PROJECT"

      - name: Build and Analyze
        run: |
          set -o pipefail

          xcodebuild clean build analyze \
            -scheme "$SCHEME" \
            -project "$PROJECT" \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -resultBundlePath "$BUILD_RESULT" \
            | xcbeautify

      - name: Run Unit Tests with Code Coverage
        run: |
          set -o pipefail

          xcodebuild test \
            -scheme "$SCHEME" \
            -project "$PROJECT" \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            -enableCodeCoverage YES \
            -parallel-testing-enabled NO \
            -only-testing:"$UNIT_TEST_TARGET" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            -resultBundlePath "$TEST_RESULT" \
            | xcbeautify

      - name: Run UI Tests with Code Coverage
        run: |
          set -o pipefail

          xcodebuild test \
            -scheme "$SCHEME" \
            -project "$PROJECT" \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            -enableCodeCoverage YES \
            -parallel-testing-enabled NO \
            -only-testing:"$UI_TEST_TARGET" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            -resultBundlePath "$TEST_RESULT" \
            | xcbeautify

      - name: Export Code Coverage Report
        if: always()
        run: |
          mkdir -p build

          if [ -d "$TEST_RESULT" ]; then
            if xcrun xccov view --report --json "$TEST_RESULT" > build/coverage.json; then
              echo "Coverage report exported."
              xcrun xccov view --report "$TEST_RESULT" > build/coverage.txt || true
              echo "----- Coverage summary -----"
              grep -E "\.app|\.xctest|^/" build/coverage.txt | head -40 || true
            else
              echo "Coverage data was not available; continuing so result bundles can still be uploaded."
              rm -f build/coverage.json
            fi
          else
            echo "Test result bundle was not created; skipping coverage export."
          fi

      - name: Upload Xcode Results and Coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: illuminate-xcode-results
          path: |
            build/*.xcresult
            build/coverage.json
            build/coverage.txt
          if-no-files-found: warn
          retention-days: 14